# Template for a fresh install. The Vultr server already has its own sites
# (orchestrator.kagzso.com + db.orchestrator.kagzso.com) - don't install this there.
#
# nginx site for this app ONLY - its own file and its own (sub)domain, so no
# existing site's config is edited.
#
# Replace before use:
#   automation.example.com            -> your new subdomain (DNS A record -> this server)
#   /var/www/kagzso-automation        -> where the repo is cloned
#   4100                              -> the API_PORT in .env (checked free by preflight.sh)
#
# Install:
#   sudo cp deploy/nginx-kagzso-automation.conf /etc/nginx/sites-available/kagzso-automation
#   sudo ln -s /etc/nginx/sites-available/kagzso-automation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx      # reload, never restart
#   sudo certbot --nginx -d automation.example.com    # HTTPS for THIS domain only

server {
    listen 80;
    server_name automation.example.com;

    # Built web app (npm run build -> apps/web/dist)
    root /var/www/kagzso-automation/apps/web/dist;
    index index.html;

    # Excel/CSV imports, template images, WhatsApp media
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
    }

    # Public template images (UPLOADS_DIR), served by the API
    location /uploads/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
    }

    # Single-page app: every other path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
